services:
  # Backend Web Service
  - type: web
    name: shikkhadwar-backend
    runtime: python
    plan: free
    region: oregon
    branch: deploy
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shikkhadwar-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: 52428800
      # Cloudinary Configuration - Add your credentials in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Set manually in dashboard
      - key: CLOUDINARY_API_KEY
        sync: false  # Set manually in dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false  # Set manually in dashboard
    autoDeploy: true
    healthCheckPath: /

databases:
  # Note: Render's free PostgreSQL service can be used for development
  # For production with NeonDB, remove this database section and manually
  # set the DATABASE_URL environment variable in Render dashboard
  - name: shikkhadwar-db
    plan: free
    databaseName: lms_db
    user: lms_user
    region: oregon
